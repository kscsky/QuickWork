name: quickwork

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: quickwork
      POSTGRES_USER: ${POSTGRES_USER:-quickwork}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quickwork}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
